# .github/workflows/docs.yml
# Builds the Docusaurus site and, on pushes to main, deploys it to Cloudflare Pages.
#
# Action SHA pinning:
#   Every action below is pinned to a 40-char commit SHA with the matching
#   version tag in a trailing comment, as in ci-validation.yaml. `wranglerVersion`
#   is pinned too: wrangler-action v4 installs `latest` when it is omitted, which
#   would let an upstream wrangler release change this deploy with no commit here.

name: Docs

on:
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - 'src/**'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'src/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          # 22 is the floor for wrangler 4.122.0, which the deploy step pins.
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Install pydoc-markdown
        run: pip install pydoc-markdown==4.8.2

      - name: Install site dependencies
        working-directory: website
        run: npm ci

      # `npm run build` runs prebuild -> pydoc-markdown + prune, then the Docusaurus
      # build with onBrokenLinks: 'throw' (the link-check gate).
      - name: Build site
        working-directory: website
        run: npm run build

      # Runs after the build so the generated .docusaurus/ types are on disk.
      - name: Type-check the site
        working-directory: website
        run: npm run typecheck

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.122.0'
          # `venice-ai-docs` names the live Cloudflare Pages project, not this
          # package. It is not user-visible — the site is served from the custom
          # domain above — and Pages projects cannot be renamed in place, so
          # changing it means creating a new project and re-pointing the domain.
          # Left as-is deliberately; it does not track the repository name.
          command: pages deploy website/build --project-name=venice-ai-docs --branch=main
