name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly security scan every Monday at 6 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:  # Allow manual triggering

jobs:
  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
      
      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .venv
        # The key is namespaced by repository on purpose. `virtualenvs-in-project`
        # puts .venv inside the workspace, and a virtualenv bakes absolute paths
        # into pyvenv.cfg, bin/activate and every console-script shebang. Renaming
        # the repo moves the workspace (/home/runner/work/<repo>/<repo>), so a
        # cache restored across a rename yields a .venv whose interpreter path no
        # longer exists. Poetry still reports "No dependencies to install or
        # update" — the dist-info metadata is all there — and the failure surfaces
        # later as `Command not found` from poetry run. actions/cache does not
        # re-save on a hit, so without the repository in the key that broken venv
        # would be restored forever.
          key: venv-${{ github.repository }}-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
      
      - name: Install dependencies
        # --all-extras so the audit covers the optional dependencies too. Without
        # it, cryptography, solders, dcap-qvl, redis and Pillow are absent from the
        # environment and pip-audit silently reports nothing about them.
        run: poetry install --all-extras --with dev

      # pip-audit runs with no suppressions. If a vulnerability ever has to be
      # waived, add --ignore-vuln entries to all three steps below (and to the
      # security target in the Makefile), with the ID, package, and reason.
      - name: Run pip-audit
        run: |
          poetry run pip-audit \
            --desc \
            --format json \
            --output audit-report.json \
            || true

      - name: Display audit results
        if: always()
        run: |
          if [ -f audit-report.json ]; then
            poetry run pip-audit \
              --desc \
              --format markdown
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: security-audit-report
          path: audit-report.json
          retention-days: 30

      - name: Check for vulnerabilities
        run: |
          # Fail the job if vulnerabilities are found
          poetry run pip-audit --desc

  code-security-scan:
    name: Code Security Scan (Bandit)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
      
      - name: Install dependencies
        run: poetry install --with dev --no-interaction
      
      - name: Run Bandit security scan
        run: |
          poetry run bandit \
            -r src/ \
            -ll \
            -f json \
            -o bandit-report.json \
            || true
      
      - name: Display Bandit results
        if: always()
        run: |
          if [ -f bandit-report.json ]; then
            poetry run bandit \
              -r src/ \
              -ll \
              -f txt
          fi
      
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30
      
      - name: Check security issues
        run: |
          # Fail if high or medium severity issues found
          poetry run bandit -r src/ -ll

  supply-chain-security:
    name: Supply Chain Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0 (was @master — pinned in audit Phase 5D-8)
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          # Passed explicitly: Trivy auto-detects the plain-text `.trivyignore`
          # but not the YAML form, and the YAML form is what carries the
          # per-entry expiry dates.
          trivyignores: '.trivyignore.yaml'
      
      # Code Scanning ingestion requires GitHub Advanced Security on private
      # repos. The artifact upload below preserves the SARIF either way, so we
      # don't fail the job when the API rejects the upload on forks/private
      # mirrors that don't have GHAS enabled.
      - name: Upload Trivy results to GitHub Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: trivy-security-report
          path: trivy-results.sarif
          retention-days: 30

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [dependency-audit, code-security-scan, supply-chain-security]
    if: always()
    
    steps:
      - name: Download all reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      
      - name: Create security summary
        run: |
          echo "# Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check job statuses
          if [ "${{ needs.dependency-audit.result }}" == "success" ]; then
            echo "✅ Dependency Audit: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Dependency Audit: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.code-security-scan.result }}" == "success" ]; then
            echo "✅ Code Security Scan: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Code Security Scan: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.supply-chain-security.result }}" == "success" ]; then
            echo "✅ Supply Chain Security: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Supply Chain Security: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Reports" >> $GITHUB_STEP_SUMMARY
          echo "Security scan reports are available as workflow artifacts." >> $GITHUB_STEP_SUMMARY