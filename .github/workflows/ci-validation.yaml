# .github/workflows/ci-validation.yaml
# This workflow runs on every pull request and push to main.
# It validates code quality, runs tests against multiple Python versions,
# and ensures the project is always in a releasable state.
#
# Action SHA pinning:
#   Every third-party action below is pinned to a 40-char commit SHA with the
#   matching version tag in a trailing comment. snok/install-poetry remains on
#   `@v1` because that org does not ship release SHAs reliably.

name: CI Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    # Add a service container for Redis
    services:
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1  # not pinned — see workflow header

      - name: Cache Poetry virtualenv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      # --all-extras is required, not optional: without it the TEE, x402 and
      # Solana test modules skip wholesale (importorskip on cryptography,
      # dcap-qvl, eth-account, siwe, solders) and mypy degrades the same
      # imports to Any. The merge gate would be green while never exercising
      # the most security-sensitive code in the SDK.
      - name: Install dependencies
        run: poetry install --with dev --all-extras

      - name: Cache MyPy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('**/*.py') }}
          restore-keys: |
            mypy-${{ runner.os }}-py${{ matrix.python-version }}-
            mypy-${{ runner.os }}-

      - name: Run code quality checks (lint, format, types)
        run: make format-check && make check-all

      - name: Generate type coverage report
        if: matrix.python-version == '3.13'
        run: make type-check-report

      - name: Upload type coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mypy-coverage-report
          path: mypy-report/
          retention-days: 30

      # Per-push gate runs every DETERMINISTIC suite — unit, cli, property,
      # provider and presets. All of them are offline: no live API, no API key,
      # no cassettes, no flakiness. Cassettes are local-dev-only (gitignored), so
      # a CI checkout has none; running integration/e2e here would force them
      # live (slow, costly, and intermittently red on transient API
      # 500s/timeouts) — which is exactly what we don't want gating merges. Full
      # live coverage runs on demand via `make test-ci` and the manual-trigger
      # `e2e.yml` workflow (which hits the live API thanks to the `--disable-vcr`
      # live-passthrough in conftest). These suites + the static jobs (build,
      # mypy, pyright, vulture, install-matrix) gate every PR deterministically.
      - name: Run deterministic tests with coverage
        env:
          VENICE_TEST_REDIS_URL: "redis://localhost:6379"
        run: |
          poetry run pytest \
            tests/unit/ tests/cli/ tests/property/ tests/provider/ tests/presets/ \
            --cov=src/venice_ai \
            --cov-report=xml:tests/reports/coverage/coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=0 \
            -n 6 --tb=short -q
        # Coverage is reported to codecov but NOT hard-gated here: the
        # deterministic suites reach ~92%, with the remainder living in the
        # integration/e2e paths. The 90% gate stays enforced in the full
        # `make test-ci` run (local + on-demand), which reaches ~94%.

      - name: Upload coverage report
        if: github.repository != 'sethbang/venice-ai-rc'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # codecov-action v5+ renamed the singular `file` input to `files`
          files: ./tests/reports/coverage/coverage.xml

  # ---------------------------------------------------------------------------
  # build (audit Phase 5D-1) — sdist + wheel via Poetry, twine-checked, archived
  # ---------------------------------------------------------------------------
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@v1  # not pinned — see workflow header

      - name: Install dependencies
        run: poetry install --with dev

      - name: Build sdist + wheel
        run: poetry build

      - name: Validate distribution metadata with twine
        run: |
          poetry run pip install --quiet twine
          poetry run twine check dist/*

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # install-matrix (audit Phase 5D-2) — wheel install + smoke import per extra
  # ---------------------------------------------------------------------------
  install-matrix:
    name: Install matrix (${{ matrix.extra }})
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: false
      matrix:
        extra:
          - ""
          - "[redis]"
          - "[adaptive]"
          - "[x402]"
          - "[cli]"
          - "[observability]"
          - "[metrics]"
          - "[enterprise]"
          - "[all]"

    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Create venv and install wheel${{ matrix.extra }}
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip
          # Guarded, not a bare glob: an unmatched glob leaves WHEEL empty and
          # `pip install "[redis]"` fails with an opaque error instead of naming
          # the real cause. The distribution rename venice_ai -> venice_py is
          # exactly how that happens.
          WHEEL=$(ls dist/venice_py-*.whl 2>/dev/null | head -1)
          if [ -z "${WHEEL}" ]; then
            echo "::error::No dist/venice_py-*.whl found. Contents of dist/:"
            ls -la dist/ || true
            exit 1
          fi
          echo "Installing: ${WHEEL}${{ matrix.extra }}"
          /tmp/venv/bin/pip install "${WHEEL}${{ matrix.extra }}"

      - name: Smoke import
        run: |
          /tmp/venv/bin/python -c "from venice_ai import VeniceClient, __version__; print(f'venice-py v{__version__} OK extra=${{ matrix.extra }}')"

  # ---------------------------------------------------------------------------
  # vulture (audit Phase 5D-4) — dead-code gate at min_confidence=80
  # ---------------------------------------------------------------------------
  vulture:
    name: Vulture (dead-code gate)
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@v1  # not pinned — see workflow header

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run vulture (min_confidence=80)
        run: poetry run vulture src/ --min-confidence 80

  # ---------------------------------------------------------------------------
  # mypy-strict (audit Phase 5D-5) — strict typecheck on critical modules
  # ---------------------------------------------------------------------------
  mypy-strict:
    name: mypy --strict (critical modules)
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@v1  # not pinned — see workflow header

      - name: Install dependencies (with x402 extras for siwe/eth_account stubs)
        run: poetry install --with dev --extras x402

      - name: Run strict mypy
        run: make type-check-strict

  # ---------------------------------------------------------------------------
  # pyright (audit Phase 5D-6) — full project pyright sanity
  # ---------------------------------------------------------------------------
  pyright:
    name: pyright (project)
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@v1  # not pinned — see workflow header

      # pyright walks all of src/, including modules guarded behind optional
      # extras (e.g. core.backends.redis, core.config.main's pydantic_settings
      # branch). Install --extras all so every conditional import resolves.
      - name: Install dependencies (--extras all so all conditional imports resolve)
        run: poetry install --with dev --extras all

      - name: Run pyright on src/
        run: poetry run pyright src/

  # ---------------------------------------------------------------------------
  # sbom (audit Phase 5D-7) — CycloneDX JSON SBOM as 90-day artifact
  # ---------------------------------------------------------------------------
  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@v1  # not pinned — see workflow header

      - name: Install dependencies
        run: poetry install --with dev

      # --all-extras is read from pyproject/poetry.lock, not the installed venv,
      # so it must be passed here even though the install step above is plain.
      # Without it the SBOM omits every optional dependency — including all of
      # cryptography, dcap-qvl, eth-account, redis, siwe and solders — which is
      # exactly the set a consumer audits this artifact for.
      - name: Generate CycloneDX SBOM
        run: poetry run cyclonedx-py poetry --all-extras --of JSON -o sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.json
          retention-days: 90
