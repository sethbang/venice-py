# .github/workflows/release.yaml
# This workflow triggers on the creation of a GitHub release.
# It builds the package and publishes it to PyPI using trusted publishing.
#
# Action SHA pinning: every third-party action below is pinned to a 40-char
# commit SHA with the matching version tag in a trailing comment.
# snok/install-poetry stays on @v1 because that org does not ship release SHAs
# reliably, and pypa/gh-action-pypi-publish stays on @release/v1 because that branch tracks
# the latest release-v1.x patch — pinning it to a commit SHA would break
# Trusted Publishing's audit trail.
#
# Trusted Publisher setup (on pypi.org). Register it from the **venice-py project's
# own** Publishing tab — https://pypi.org/manage/project/venice-py/settings/publishing/
# — not from the account-level pending-publisher form and not from another project:
#
#        - PyPI Project Name:    venice-py
#        - Owner:                sethbang
#        - Repository name:      venice-py
#        - Workflow name:        release.yaml      <- .yaml, NOT .yml
#        - Environment name:     pypi
#
# Two ways this goes wrong quietly:
#
#   1. Registered under the wrong project. PyPI still mints a token, because the
#      claims match — it is just scoped elsewhere — and the upload fails with
#      "403 Invalid API Token: OIDC scoped token is not valid for project
#      'venice-py'". A publisher that matches nothing fails earlier and looks
#      different: a trusted-publishing *exchange* error, not a 403.
#   2. Recorded as release.yml. This repo uses both extensions (.yaml here and in
#      publish-testpypi.yaml, .yml for docs/e2e/security-scan/skills/examples), so
#      the wrong one is easy to type and simply never matches.
#
# A publisher is only proven by a successful upload, never by its config page, and
# PyPI versions are not reusable — so exercise changes through
# publish-testpypi.yaml first. TestPyPI and PyPI are configured separately; a
# mistake on one is likely repeated on the other.

name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # Required for trusted publishing

jobs:
  # ---------------------------------------------------------------------------
  # version-check — assert pyproject.version matches the
  # GitHub release tag (with optional leading 'v' stripped) before building.
  # Fails fast with ::error:: if they diverge so we never publish a mismatched
  # artifact to PyPI.
  # ---------------------------------------------------------------------------
  version-check:
    name: Verify pyproject.version matches release tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Compare pyproject.version against release tag
        run: |
          set -euo pipefail
          py_version=$(grep -E '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          tag_raw="${{ github.event.release.tag_name }}"
          tag_version="${tag_raw#v}"
          echo "pyproject.version: ${py_version}"
          echo "release tag (stripped): ${tag_version}"
          if [ "${py_version}" != "${tag_version}" ]; then
            echo "::error::pyproject.version (${py_version}) does not match release tag (${tag_version}). Refusing to publish."
            exit 1
          fi
          echo "OK — versions match."

  build-and-publish:
    runs-on: ubuntu-latest
    needs: version-check
    # Fail-safe: only repos under the canonical owner may publish to PyPI, never a
    # fork. Matched on the OWNER, not `owner/repo`: a hardcoded repo name silently
    # turns this job into a no-op the moment the repo is renamed (green check,
    # nothing published), and the owner is the part that actually gates forks.
    if: github.repository_owner == 'sethbang'
    environment:
      name: pypi
      url: https://pypi.org/p/venice-py

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13" # Use a specific, stable version for builds

      - name: Install Poetry
        uses: snok/install-poetry@v1  # not pinned — see workflow header

      - name: Build the package
        run: poetry build

      - name: Validate distribution metadata with twine
        run: |
          poetry run pip install --quiet twine
          poetry run twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1  # not pinned — see workflow header
        with:
          packages-dir: dist/
