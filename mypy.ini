[mypy]
# Represents minimum Python version (3.11+)
python_version = 3.11
mypy_path = src
explicit_package_bases = True
exclude = src/venice_ai/test_support/.*\.py$

# Baseline strictness (gradually being enhanced)
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
check_untyped_defs = True

# Not yet enabled globally - will enable module by module
disallow_untyped_defs = False
disallow_any_unimported = False
disallow_any_expr = False
disallow_any_decorated = False
disallow_any_explicit = False
disallow_any_generics = False
disallow_subclassing_any = False
disallow_untyped_calls = False
disallow_incomplete_defs = False
disallow_untyped_decorators = False

# Still need this for some third-party packages
ignore_missing_imports = True

# Show error codes for easier suppression
show_error_codes = True
show_column_numbers = True

# Per-module overrides for gradual strictness adoption
# Modules are enabled in order of priority as they pass stricter checks

[mypy-venice_ai.exceptions]
# Well-typed, can enable strict mode
ignore_missing_imports = False
disallow_untyped_defs = True
disallow_incomplete_defs = True
warn_return_any = True
warn_unreachable = True

[mypy-venice_ai.costs]
# Simple module with type hints
ignore_missing_imports = False
disallow_untyped_defs = True

[mypy-venice_ai._client]
# Main client module - core API orchestrator
ignore_missing_imports = False
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_return_any = True
warn_unreachable = True

[mypy-venice_ai.streaming]
# Streaming response handling
ignore_missing_imports = False
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_return_any = True
warn_unreachable = True

[mypy-venice_ai.factory]
# Dependency injection factory
ignore_missing_imports = False
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_return_any = True

# Third-party packages that don't have stubs
[mypy-aiohttp.*]
ignore_missing_imports = True

[mypy-redis.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-filelock.*]
ignore_missing_imports = True

[mypy-tiktoken.*]
ignore_missing_imports = True

[mypy-prometheus_client.*]
ignore_missing_imports = True

[mypy-psutil.*]
ignore_missing_imports = True

[mypy-PIL.*]
ignore_missing_imports = True

[mypy-rich.*]
ignore_missing_imports = True

[mypy-textual.*]
ignore_missing_imports = True

[mypy-vcrpy.*]
ignore_missing_imports = True

[mypy-freezegun.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True

[mypy-networkx.*]
ignore_missing_imports = True
