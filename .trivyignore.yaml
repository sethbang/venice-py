# Accepted findings, scoped to the documentation site.
#
# Nothing listed here reaches anyone who installs the package: pyproject.toml
# ships src/venice_ai alone, and website/ builds a static site that Cloudflare
# Pages serves with no runtime server of its own.
#
# Every entry carries an expiry so it returns for review instead of suppressing
# a finding that has since become fixable.

vulnerabilities:
  - id: CVE-2026-118764
    paths:
      - "website/package-lock.json"
    statement: >-
      minimatch 9.0.9 denial of service via a crafted glob. The only 9.x copy is
      the one docusaurus-plugin-llms pulls in: its latest release, 0.6.2, still
      pins minimatch 9.0.3, which an override in website/package.json moves to
      9.0.9. The plugin calls minimatch with {matchBase: true} only, while the
      advisory needs optimizationLevel >= 2, and the patterns it matches come
      from our own docusaurus config at build time. The fix, 11.0.1, is two
      majors above what the plugin pins.
    expired_at: 2027-02-20
