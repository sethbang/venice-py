[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "venice-py"
version = "2.2.1"
description = "Unofficial, community-maintained Python SDK for Venice.ai, offering comprehensive access to the API with unified architecture and intelligent rate limiting."
readme = "README.md"
license = "MIT"
authors = ["Seth Bang <howdy@sbang.dev>"]
keywords = [
    "ai",
    "api-client",
    "generative-ai",
    "llm",
    "machine-learning",
    "ml",
    "sdk",
    "venice",
    "venice-ai",
    "venice-py",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
    "Typing :: Typed",
]
packages = [{ include = "venice_ai", from = "src" }]
# skills/*/evals holds held-out calibration sets for the bundled skills. They are
# authoring-time material, never read at runtime (`venice-py skills install` filters
# them out), and publishing them would leak the test set into every install.
exclude = ["src/venice_ai/test_support", "src/venice_ai/skills/*/evals"]

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
aiohttp = { extras = [
    "speedups",
], version = ">=3.13.4,<3.15" } # Async HTTP client. The earlier <3.14 cap (aiohttp 3.14 removed
# aiohttp.streams.AsyncStreamReaderMixin, breaking every VCR-based integration test) was lifted once
# vcrpy 8.2.0 shipped the 3.14 compatibility fix (issue #995); dev dep pinned to vcrpy ^8.2.1 below.
pydantic = "^2.13.4" # For data validation and serialization
idna = ">=3.15" # Security floor: CVE-2026-45409 (transitive)
pyyaml = { version = "^6.0.3", optional = true } # For YAML config file support
prometheus-client = { version = "^0.26.0", optional = true }
rich = { version = "^15.0.0", optional = true } # For rich terminal output in dashboard and CLI
# tiktoken / textual / psutil are deliberately absent: no module under src/ imports
# any of them, so shipping them in the `all` extra only inflated the install. The
# two that tests do use (tiktoken, psutil) stay in the dev group below.
filelock = { version = "^3.29.0", optional = true }
Pillow = { version = "^12.2.0", optional = true } # For image processing (e.g., dimension checks)
redis = { version = "^8.0.0", optional = true }
pydantic-settings = { version = "^2.14.1", optional = true }
adaptive-rate-limiter = { version = "^1.3.0", optional = true }
opentelemetry-api = { version = "^1.41.0", optional = true } # For distributed tracing
opentelemetry-sdk = { version = "^1.41.0", optional = true } # For distributed tracing
# CLI dependencies (optional - install with pip install venice-py[cli])
click = { version = "^8.4.1", optional = true }         # CLI framework
python-dotenv = { version = "^1.2.2", optional = true } # Environment variable loading
aiofiles = { version = "^25.1.0", optional = true }     # Async file operations for CLI
questionary = { version = "^2.1.1", optional = true }   # Interactive CLI prompts
# x402 (SIWE wallet auth) dependencies — install with pip install venice-py[x402]
eth-account = { version = "^0.13.7", optional = true }  # Ethereum account signing
siwe = { version = "^4.4.0", optional = true }          # EIP-4361 SIWE message builder
# Transitive via siwe, constrained here because siwe allows >=2.2,<3 and abnf
# 2.9.0 made redefining an RFC 5234 core rule an error. siwe's own rfc5234
# grammar redefines ALPHA, so 2.9.0 breaks `import siwe` outright.
abnf = { version = ">=2.2,<2.9", optional = true }
# x402 Solana (SIWS wallet auth + settlement) — install with pip install venice-py[x402-solana]
solders = { version = ">=0.28,<0.30", optional = true }      # Solana ed25519 signing / base58 / tx build
# TEE client-side E2EE (secp256k1 ECDH + HKDF + AES-GCM) — install with pip install venice-py[e2ee]
cryptography = { version = ">=46.0.0,<51.0.0", optional = true } # secp256k1 ECDH, HKDF-SHA256, AES-256-GCM for TEE E2EE.
# Ceiling allows 46–50; 49 dropped Intel-macOS/32-bit-Windows wheels but the TEE primitives we use are unchanged. The floor
# stays at 46 deliberately: CVE-2026-69247 (fixed in 50.0.0) is a Bleichenbacher oracle in PKCS#7 EnvelopedData decryption,
# an API this SDK never calls, so requiring 50 would narrow platform support without closing a reachable hole.
# Full client-side Intel TDX attestation verification — install with pip install venice-py[e2ee-verify]
dcap-qvl = { version = "^0.6.1", optional = true }      # Phala pure-Rust DCAP TDX quote verifier

[tool.poetry.extras]
observability = ["opentelemetry-api", "opentelemetry-sdk"]
metrics = ["prometheus-client"]
cli = [
    "click",
    "rich",
    "python-dotenv",
    "aiofiles",
    "questionary",
    "Pillow",
    "pyyaml",
    "filelock",
]
redis = ["redis"]
adaptive = ["adaptive-rate-limiter", "redis"]
x402 = ["eth-account", "siwe", "abnf"]
x402-solana = ["solders"]
e2ee = ["cryptography"]
e2ee-verify = ["dcap-qvl", "cryptography"]
enterprise = [
    "adaptive-rate-limiter",
    "redis",
    "prometheus-client",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "pydantic-settings",
]
all = [
    "adaptive-rate-limiter",
    "redis",
    "prometheus-client",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "pydantic-settings",
    "click",
    "rich",
    "python-dotenv",
    "aiofiles",
    "questionary",
    "Pillow",
    "pyyaml",
    "filelock",
    "eth-account",
    "siwe",
    "abnf",
    "solders",
    "cryptography",
    "dcap-qvl",
]

[tool.poetry.urls]
Homepage = "https://github.com/sethbang/venice-py"
Repository = "https://github.com/sethbang/venice-py"
Documentation = "https://venice-docs.sbang.dev"
"Issue Tracker" = "https://github.com/sethbang/venice-py/issues"
"Changelog" = "https://github.com/sethbang/venice-py/blob/main/CHANGELOG.md"

[tool.poetry.group.dev.dependencies]
adaptive-rate-limiter = "^1.3.0"
pytest = "^9.0.3"
pytest-timeout = "^2.4.0"
pytest-cov = "^7.1.0"
pytest-asyncio = "^1.4.0"
pytest-aiohttp = "^1.1.0"
pytest-mock = "^3.15.1"
ruff = "^0.16.2"
black = "^26.5.1"
mypy = "^2.1.0"
coverage = "^7.14.1"
questionary = "^2.1.1"
rich = "^15.0.0"
textual-dev = "^1.8.0"                # Textual devtools console (dev-only; not shipped or in an extra)
# CLI dependencies needed for dev/testing
click = "^8.4.1"
aiofiles = "^25.1.0"
pytest-xdist = "^3.8.0"
pytest-rerunfailures = "^16.2"
beautifulsoup4 = "^4.14.3"
Pillow = "^12.2.0"                   # For image processing (e.g., dimension checks)
numpy = "^2.4.6"                     # For numerical operations, required by some tests
pypandoc = "^1.17"
tiktoken = ">=0.13,<0.15"                 # For token estimation in tests
freezegun = "^1.5.5"
python-dotenv = "^1.2.2"
pyyaml = "^6.0.3"
prometheus-client = "^0.26.0"
psutil = "^7.2.2"
# networkx: Python 3.14.1 is excluded due to a known compatibility issue with networkx's C-extension
# build on that specific patch release; constraint can be removed once upstream fixes land.
networkx = { version = "^3.6.1", python = ">=3.11,<3.14.1 || >3.14.1,<4.0" }
pip-audit = "^2.10.0"
bandit = "^1.9.4"
vcrpy = "^8.2.1"                                                            # ^8.2.0 required for aiohttp 3.14 compat (issue #995)
pytest-vcr = "^1.0.2"                                                        # Provides --disable-vcr flag for CI
vulture = "^2.16"
mutmut = "^3.5.0"
hypothesis = "^6.155.1"
# pip removed - Poetry manages pip itself, no need to pin it as a dev dependency
# This also resolves GHSA-4xh5-x5gv-qwph vulnerability from pinned pip 25.2
setuptools = "^84.0.0"
pyflakes = "^3.4.0"
pyright = "^1.1.0"
cyclonedx-bom = "^7.0.0"

[tool.poetry.group.test.dependencies]
freezegun = "^1.5.5"

[tool.poetry.group.profiling.dependencies]
py-spy = "^0.4.2"
snakeviz = "^2.2.2"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
pythonpath = ["src"]
testpaths = ["tests"]                          # Only discover tests in tests/ directory, not examples/
# Ignore slow benchmarks and profiling tests for mutation testing and general test runs
norecursedirs = [
    "tests/benchmarks",
    "tests/profiling",
    "examples",
    ".hypothesis",
]
filterwarnings = [
    # Suppress hypothesis plugin warning about .hypothesis directory collection
    "ignore:Skipping collection of '.hypothesis' directory:UserWarning",
    # Suppress aiohttp v4 deprecation warning about bytes creating file fields
    "ignore:In v4, passing bytes will no longer create a file field:DeprecationWarning",
    # Suppress pydantic-settings warning when tests create configs with redis_url but MEMORY backend
    "ignore:Redis URL is configured but backend_type is MEMORY:UserWarning",
]
markers = [
    "integration: marks tests as integration tests",
    "benchmark: marks tests as benchmark tests",
    "profiling: marks tests as profiling/performance tests (excluded by default)",
    "vcr: marks tests that use VCR for recording/replaying API interactions",
    "e2e: marks tests as end-to-end tests",
    "cluster: marks tests that require a Redis cluster",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "requires_dedicated_key: marks tests that require a dedicated API key",
]

[tool.coverage.run]
source = ["src"]
branch = true
parallel = true
omit = [
    "*/__main__.py",
    "src/venice_ai/test_support/*",
    "src/venice_ai/types/generated/*",
]

[tool.coverage.paths]
source = ["venice_ai", "src/venice_ai"]

[tool.coverage.report]
# Raised 80 → 90 in audit Phase 5F. Full `make test-ci` lands ~95 %; the 90 %
# floor gives ~5 percentage points of breathing room before CI breaks. See
# audit Phase 2E for the per-module coverage that makes this safe (augment 98 %,
# music 99 %, all other modules ≥ 88 %).
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "    pass",                   # Allow 'pass' on its own line if it's the only thing in a TYPE_CHECKING block
]

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
target-version = "py313"
line-length = 100
# Honour excludes even when a path is named explicitly on the command line, so
# the Markdown carve-out under [tool.ruff.format] also holds for editors and
# hooks that invoke ruff file-by-file rather than by directory.
force-exclude = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line-too-long (handled by formatter)
    "B008", # do not perform function calls in default arguments
    "B905", # zip() without explicit strict= parameter
]

[tool.ruff.lint.isort]
known-first-party = ["venice_ai"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
# Markdown is authored, not generated. Ruff formats Python code fences inside
# Markdown, which rewrites the hand-tuned snippets in the bundled skill docs —
# collapsing column-aligned trailing comments and wrapping lines that were sized
# to read well on a docs page. Only the formatter reads Markdown; `ruff check`
# ignores it either way, so nothing is lost by turning this off.
exclude = ["*.md"]

[tool.vulture]
# Audit Phase 2A baseline (2026-05-01): zero findings at min_confidence=80 on
# `src/`. The settings below pin that behavior so the `make check-dead-code`
# gate stays meaningful and reproducible across environments.
#
# `min_confidence=80` is the project default. Lower values surface large
# numbers of true false positives (Pydantic field declarations, Click CLI
# subcommand decorators, abstract method bodies, enum members, public API
# methods consumed only by `tests/` or `examples/`); allowlisting all of
# them inline would be more brittle than just leaving the threshold at 80.
paths = ["src/"]
min_confidence = 80
ignore_decorators = [
    # Click CLI — every `@app.command()` and `@click.group()` body is reached
    # via the entry-point script `venice_ai.cli:cli`, not by direct call.
    "@app.command",
    "@click.command",
    "@click.group",
    "@click.pass_context",
    # Pydantic validators — invoked by Pydantic's metaclass machinery.
    "@field_validator",
    "@model_validator",
    "@validator",
    "@root_validator",
    # Stdlib — properties, classmethods, async ctx managers, abstract methods.
    "@property",
    "@classmethod",
    "@staticmethod",
    "@abstractmethod",
    "@asynccontextmanager",
    "@contextmanager",
    # Pytest — referenced by name through pytest's collection.
    "@pytest.fixture",
]
ignore_names = [
    # Pydantic — `model_config` / `Config` are introspected, not called.
    "model_config",
    # Pydantic v1-compat shims kept for downstream callers.
    "validate_*",
    # Dunder methods are never "called" in vulture's static view.
    "__aenter__",
    "__aexit__",
    "__getattr__",
    "__dir__",
]
exclude = [
    # Generated files, vendored code, anything we don't author.
    "*/__pycache__/*",
]

[tool.poetry.scripts]
venice-py = "venice_ai.cli:cli"
